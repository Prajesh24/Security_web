name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token.
permissions:
  contents: read

jobs:
  # ── Build + type-check both apps ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Build (TypeScript compile / Next build)
        run: npm run build
        env:
          # Non-secret placeholder so the frontend build has an API URL.
          NEXT_PUBLIC_API_URL: http://localhost:6060

  # ── Dependency vulnerability scan ───────────────────────────────────────────
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (full report, always visible)
        run: npm audit || true
      # Hard gate: fail the build on critical advisories. Lower-severity
      # advisories that currently require a breaking major upgrade are triaged
      # and accepted in SECURITY.md rather than blocking every build.
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
